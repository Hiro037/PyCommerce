[tool.poetry]
name = "pycommerce"
version = "0.1.0"
description = ""
authors = ["Said Magomedov <saidmagomedov037@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.1.2"
mypy = "^1.15.0"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 88
exclude = [".venv", "migrations", "__pycache__"]

[tool.mypy]
ignore_missing_imports = true
strict = true

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
